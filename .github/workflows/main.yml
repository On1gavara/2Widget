name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Настроить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Распаковать ZIP и подготовить проект
        run: |
          mkdir -p project
          unzip -q counters-widget.zip -d project
          
          APP_PARENT=$(find project -maxdepth 3 -type d -name "app" -exec dirname {} \; | head -n 1)
          if [ -z "$APP_PARENT" ]; then
            echo "Ошибка: папка app не найдена в архиве"
            exit 1
          fi
          
          cd "$APP_PARENT"
          echo "PROJECT_DIR=$(pwd)" >> $GITHUB_ENV
          
          # Генерируем настоящую PNG-иконку 48x48, чтобы Android гарантированно открывал приложение
          mkdir -p app/src/main/res/mipmap-mdpi
          python3 -c '
          import zlib, struct
          w, h = 48, 48
          raw = b"".join(b"\x00" + (b"\x3d\xdc\x84\xff" * w) for _ in range(h))
          def chunk(tag, data):
              return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data))
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("app/src/main/res/mipmap-mdpi/ic_launcher.png", "wb").write(png)
          open("app/src/main/res/mipmap-mdpi/ic_launcher_round.png", "wb").write(png)
          '

          if [ ! -f "gradle.properties" ]; then
            cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          fi

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Counters"
          include(":app")
          EOF
          fi

          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.counters"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.counters"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
          }
          EOF
          fi

      - name: Собрать Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Сохранить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: counters-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
